<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs>
  <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f3fbf"/></marker>
  <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>

<!-- arrows -->
<g fill="none" stroke-width="2.5">
  <line x1="190" y1="240" x2="238" y2="105" stroke="#666" marker-end="url(#aG)"/>
  <line x1="190" y1="320" x2="238" y2="455" stroke="#666" marker-end="url(#aG)"/>
  <line x1="450" y1="75" x2="508" y2="75" stroke="#1f3fbf" marker-end="url(#aB)"/>
  <line x1="450" y1="125" x2="508" y2="255" stroke="#1f3fbf" marker-end="url(#aB)"/>
  <line x1="720" y1="255" x2="778" y2="165" stroke="#1f3fbf" marker-end="url(#aB)"/>
  <line x1="720" y1="305" x2="778" y2="375" stroke="#1f3fbf" marker-end="url(#aB)"/>
  <path d="M450,485 H750 V220 H778" stroke="#2e7d32" stroke-dasharray="8 5" marker-end="url(#aN)"/>
  <path d="M750,425 H778" stroke="#2e7d32" stroke-dasharray="8 5" marker-end="url(#aN)"/>
  <path d="M720,65 H1140 V203" stroke="#c62828" marker-end="url(#aR)"/>
  <line x1="990" y1="185" x2="1048" y2="250" stroke="#c62828" marker-end="url(#aR)"/>
  <line x1="990" y1="400" x2="1048" y2="315" stroke="#c62828" marker-end="url(#aR)"/>
</g>

<!-- boxes -->
<g stroke-width="2">
  <rect x="10" y="205" width="180" height="150" rx="8" fill="#fff3e0" stroke="#e67e22"/>
  <rect x="240" y="20" width="210" height="110" rx="8" fill="#eef1fb" stroke="#1f3fbf"/>
  <rect x="510" y="20" width="210" height="110" rx="8" fill="#eef1fb" stroke="#1f3fbf"/>
  <rect x="510" y="225" width="210" height="110" rx="8" fill="#eef1fb" stroke="#1f3fbf"/>
  <rect x="240" y="430" width="210" height="110" rx="8" fill="#edf7ee" stroke="#2e7d32"/>
  <rect x="780" y="125" width="210" height="110" rx="8" fill="#f4f4f4" stroke="#555"/>
  <rect x="780" y="345" width="210" height="110" rx="8" fill="#f4f4f4" stroke="#555"/>
  <rect x="1050" y="205" width="180" height="150" rx="8" fill="#fdecea" stroke="#c62828"/>
</g>

<g text-anchor="middle" fill="#111">
  <!-- Ch1 -->
  <text x="100" y="240" font-size="19" font-weight="bold">第1章</text>
  <text x="100" y="267" font-size="15">不確実性と危険選好</text>
  <text x="100" y="300" font-size="13" fill="#555">期待効用・危険回避度</text>
  <text x="100" y="319" font-size="13" fill="#555">HARA 型効用関数</text>
  <text x="100" y="340" font-size="13" fill="#e67e22" font-weight="bold">全章の土台</text>
  <!-- Ch2 -->
  <text x="345" y="52" font-size="19" font-weight="bold">第2章</text>
  <text x="345" y="80" font-size="15">平均分散分析と CAPM</text>
  <text x="345" y="112" font-size="13" fill="#555">最小分散フロンティア・2基金分離</text>
  <!-- Ch3 -->
  <text x="615" y="52" font-size="19" font-weight="bold">第3章</text>
  <text x="615" y="80" font-size="15">平均分散分析の拡張</text>
  <text x="615" y="112" font-size="13" fill="#555">楕円分布族・歪度と尖度</text>
  <!-- Ch5 -->
  <text x="615" y="252" font-size="19" font-weight="bold">第5章</text>
  <text x="615" y="276" font-size="15">効率的ポートフォリオと</text>
  <text x="615" y="295" font-size="15">ポートフォリオ分離</text>
  <text x="615" y="321" font-size="13" fill="#555">確率的優越・<tspan font-family="Times New Roman, serif" font-weight="normal" font-style="italic">K</tspan> 基金分離</text>
  <!-- Ch4 -->
  <text x="345" y="462" font-size="19" font-weight="bold">第4章</text>
  <text x="345" y="490" font-size="15">完備市場における価格付け</text>
  <text x="345" y="522" font-size="13" fill="#555">無裁定・純粋証券・危険中立確率</text>
  <!-- Ch6 -->
  <text x="885" y="157" font-size="19" font-weight="bold">第6章</text>
  <text x="885" y="185" font-size="15">因子モデルと線形価格付け</text>
  <text x="885" y="217" font-size="13" fill="#555">競争均衡と分離・APT</text>
  <!-- Ch7 -->
  <text x="885" y="372" font-size="19" font-weight="bold">第7章</text>
  <text x="885" y="396" font-size="15">代表的消費者の合成と</text>
  <text x="885" y="415" font-size="15">経済厚生</text>
  <text x="885" y="441" font-size="13" fill="#555">パレート効率性・実質的完備市場</text>
  <!-- Ch8 -->
  <text x="1140" y="240" font-size="19" font-weight="bold">第8章</text>
  <text x="1140" y="267" font-size="15">確率的割引ファクター</text>
  <text x="1140" y="286" font-size="15">と価格付け理論のまとめ</text>
  <text x="1140" y="325" font-size="13" fill="#c62828" font-weight="bold">全理論を統一的に整理</text>
</g>

<!-- edge labels -->
<g font-size="12.5" fill="#333">
  <text x="900" y="57">SDF の観点から統一</text>
  <text x="460" y="478" fill="#2e7d32">無裁定・完備市場の議論</text>
  <text x="466" y="200" fill="#1f3fbf" text-anchor="end">一般化</text>
</g>
</svg>
