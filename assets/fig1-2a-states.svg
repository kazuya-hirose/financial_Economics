<text x="388" y="172" font-size="22" text-anchor="middle" fill="#c62828" ><tspan font-family="Times New Roman, serif" font-weight="normal" font-style="italic">π</tspan><tspan dy="6" font-size="14" font-family="Times New Roman, serif" font-style="normal" font-weight="normal">1</tspan><tspan dy="-6" font-size="2"> </tspan></text>
