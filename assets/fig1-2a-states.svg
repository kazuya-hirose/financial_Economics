<text x="967" y="335" font-size="28" text-anchor="middle" fill="#555" >⋮</text>
<text x="620" y="518" font-size="17" text-anchor="middle" fill="#555" >赤は各状態の生起確率 <tspan font-family="Times New Roman, serif" font-weight="normal" font-style="italic">π</tspan><tspan dy="6" font-size="14" font-family="Times New Roman, serif" font-style="italic" font-weight="normal">s</tspan><tspan dy="-6" font-size="2"> </tspan>&#160;を表す。どの状態が実現するかによって，消費計画とその効用が決まる。</text>
